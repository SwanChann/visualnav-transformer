name: nomad_train_sim
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.8.5
  - pip=24.2
  - setuptools=75.1.0
  - wheel=0.44.0
  - pip:
      # Base environment: same training/offline stack as environment.yaml.
      - torch==2.4.1
      - torchvision==0.19.1
      - numpy==1.24.3
      - matplotlib==3.7.2
      - opencv-python==4.6.0.66
      - Pillow==10.4.0
      - h5py==3.6.0
      - tqdm==4.64.0
      - PyYAML==6.0.3
      - diffusers==0.11.1
      - huggingface-hub==0.10.1
      - efficientnet-pytorch==0.7.1
      - vit-pytorch==1.15.7
      - positional-encodings==6.0.3
      - timm==1.0.26
      - einops==0.8.1
      - wandb==0.12.18
      - prettytable==3.11.0
      - lmdb==1.7.5
      - protobuf==3.20.3
      - shortuuid==1.0.13
      - GitPython==3.1.45
      - requests==2.32.4
      - gdown==5.2.0
      - safetensors==0.5.3
      - warmup-scheduler==0.3.2
      - --extra-index-url https://rospypi.github.io/simple/
      - rosbag==1.15.11
      - roslz4==1.14.3.post2
      - rospkg==1.6.0
      - std-msgs==0.5.13.post0

      # MuJoCo / PyBullet simulation experiments.
      # mujoco 3.2.7 requires Python >=3.9, so 3.2.3 is the Python 3.8-compatible pin.
      - mujoco==3.2.3
      - pybullet==3.2.7
      - onnxruntime==1.19.2

      # Re-pin these after optional simulation packages so they do not drift.
      - numpy==1.24.3
      - protobuf==3.20.3

      - -e ../diffusion_policy
      - -e ./train
