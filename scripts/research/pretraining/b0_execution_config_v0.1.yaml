model:
  family: tinynavbrain
  encoder: efficientnet_b0_shared
  encoder_weights: null
  random_initialization: true
  pretrained_download_forbidden: true
  max_trainable_parameters: 20000000

runs:
  - id: h0-200
    head: h0_deterministic
    optimizer_steps: 200
    loss: masked_smooth_l1_meter_dataset_macro
  - id: h1-200
    head: h1_rectified_flow
    optimizer_steps: 200
    loss: masked_rectified_flow_velocity_mse_dataset_macro

training:
  seed: 0
  reset_seed_before_each_run: true
  independent_model_per_run: true
  run_order: [h0-200, h1-200]
  total_optimizer_steps_if_authorized: 400
  total_backward_calls_if_authorized: 800
  micro_batch_size: 4
  gradient_accumulation_steps: 2
  effective_batch_size: 8
  optimizer:
    name: adamw
    learning_rate: 0.0001
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 0.00000001
  scheduler: null
  precision:
    autocast: true
    autocast_dtype: float16
    grad_scaler: true
    init_scale: 65536.0
    growth_factor: 2.0
    backoff_factor: 0.5
    growth_interval: 2000
  gradients:
    zero_grad_set_to_none: true
    max_l2_norm: 10.0
    non_finite_policy: fail_closed_no_step
  ema:
    enabled: true
    decay: 0.999
    update_after_optimizer_step: 0
    update_every_optimizer_steps: 1
    include_trainable_parameters_only: true

checkpoint:
  root: results/research/pretraining/b0_go_stanford_v0.1
  format: torch_save_pt_local_only_until_separate_git_policy
  save_every_optimizer_steps: 50
  save_at_final_step: true
  keep_last: 3
  save_only_at_accumulation_boundary: true
  required_state:
    - model
    - optimizer
    - grad_scaler
    - ema
    - python_rng
    - numpy_rng
    - torch_cpu_rng
    - torch_cuda_rng_all_visible_devices
    - deterministic_batch_cursor
    - exposure_counters
    - optimizer_step
  exact_resume_probe_optimizer_step: 100
  exact_resume_probe_additional_optimizer_steps: 0
  exact_resume_requires:
    - metadata_match
    - model_state_exact
    - optimizer_state_exact
    - grad_scaler_state_exact
    - ema_state_exact
    - rng_probe_exact
    - next_batch_identity_exact

reporting:
  log_every_optimizer_steps: 10
  retain_per_step_action_loss: true
  retain_gradient_norm: true
  retain_grad_scaler_scale: true
  retain_examples_seen: true
  measure_peak_cuda_memory: true
  timing_scope: optimizer_step_including_two_micro_batches_excluding_checkpoint_io
  evaluation_performed: false

execution_guard:
  required_cli_mode: execute
  required_authorization_token: RUN-B0-H0-200-H1-200
  required_branch: agent/ubuntu-sim-handoff
  require_tracked_worktree_clean: true
  require_head_equals_origin_branch: true
  dry_run_is_non_training: true
  authorization_granted_in_this_config: false

claims_forbidden:
  - convergence
  - model_quality
  - method_improvement
  - cross_dataset_generalization
  - deployment_latency
