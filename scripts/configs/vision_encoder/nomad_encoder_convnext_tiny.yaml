# 中文注释：ConvNeXt-Tiny 视觉编码器升级实验配置模板
project_name: nomad-backbone-suite
run_name: nomad_convnext_tiny

# 中文注释：默认开启 wandb，便于和其他编码器实验统一记录
use_wandb: True
train: True
batch_size: 32
eval_batch_size: 32
epochs: 100
gpu_ids: [0]
num_workers: 6
lr: 5e-5
optimizer: adamw
clipping: False
max_norm: 1.0
use_amp: True
allow_tf32: True
grad_accum_steps: 2
scheduler: cosine
warmup: True
warmup_epochs: 2
cyclic_period: 10
plateau_patience: 3
plateau_factor: 0.5
seed: 0

# 中文注释：训练入口会根据 --backbone 自动覆盖 encoder_backbone 和 image_size
model_type: nomad
vision_encoder: nomad_vint_backbone_suite
encoder_backbone: convnext_tiny
encoding_size: 256
freeze_backbone: True
share_goal_encoder: True
attn_unet: False
cond_predict_scale: False
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4
down_dims: [64, 128, 256]

num_diffusion_iters: 10
goal_mask_prob: 0.5

normalize: True
context_type: temporal
context_size: 3
alpha: 1e-4

distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 3
  max_dist_cat: 20

len_traj_pred: 8
learn_angle: False
image_size: [96, 96]

datasets:
  go_stanford:
    data_folder: nomad_dataset/go_stanford
    train: train/vint_train/data/data_splits/go_stanford/train/
    test: train/vint_train/data/data_splits/go_stanford/test/
    end_slack: 0
    goals_per_obs: 2
    negative_mining: True
    waypoint_spacing: 1

print_log_freq: 200
image_log_freq: 0
num_images_log: 8
pairwise_test_freq: 0
eval_fraction: 0.1
wandb_log_freq: 10
eval_freq: 2
